<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    The base href is replaced by the value of the `--base-href` argument provided to `flutter build`.
    It has to start and end with a slash "/".
  -->
  <base href="/interpreter-ledger/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="외국인 환자 통역 기록과 급여를 관리하는 앱">
  <!-- 직원용 내부 도구이므로 검색 엔진에 노출하지 않는다. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B6E99">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="통역 장부">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>통역 장부</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#F5FAFD">
  <!-- 앱이 뜨기 전까지 보이는 안내. 첫 화면이 그려지면 지운다. -->
  <div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;font-size:16px;color:#0B6E99;">
    통역 장부를 불러오는 중…
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js?v=20261114025808" async></script>
</body>
</html>
